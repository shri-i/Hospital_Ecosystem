{% extends 'base.html' %}
{% block title %}{{ 'Edit' if editing else 'Add' }} department{% endblock %}
{% block content %}
<div class="page-header">
  <div><h1>{{ 'Edit department' if editing else 'Add department' }}</h1></div>
  <a class="btn btn-outline-secondary" href="{{ url_for('admin.departments') }}"><i class="bi bi-arrow-left"></i> Back</a>
</div>
<div class="card p-4" style="max-width: 640px">
  <form method="post" novalidate>
    <div class="mb-3">
      <label class="form-label">Name *</label>
      <input class="form-control" name="name" required maxlength="100" value="{{ dept.get('name', '') }}">
    </div>
    <div class="mb-4">
      <label class="form-label">Description</label>
      <textarea class="form-control" name="description" rows="3" maxlength="255">{{ dept.get('description') or '' }}</textarea>
    </div>
    <button class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
  </form>
</div>
{% endblock %}
